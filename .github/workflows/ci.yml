name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Submit the Windows ZIP to SignPath for manual approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux · Qt 6.4
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Check that the release tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^set(DIFFPICK_VERSION \([0-9.]*\)).*/\1/p' cmake/DiffpickVersion.cmake)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in cmake/DiffpickVersion.cmake"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake g++ ninja-build qt6-base-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build build-Linux --parallel

      - name: Test
        run: ctest --test-dir build-Linux --output-on-failure --timeout 60

  windows:
    name: Windows · MSVC 2022 · Qt 6.8
    runs-on: windows-2022
    env:
      WINDOWS_QT_VERSION: '6.8.3'
    outputs:
      artifact_id: ${{ steps.upload-windows.outputs.artifact-id }}
      product_version: ${{ steps.windows-version.outputs.version }}
      package_name: ${{ steps.windows-version.outputs.package_name }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.WINDOWS_QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install Qt license texts
        run: |
          $licenseDir = Join-Path $env:QT_ROOT_DIR 'LICENSES'
          New-Item -ItemType Directory -Path $licenseDir -Force | Out-Null
          $upstream = "https://raw.githubusercontent.com/qt/qtbase/v$env:WINDOWS_QT_VERSION/LICENSES"
          foreach ($license in @('LGPL-3.0-only.txt', 'GPL-3.0-only.txt')) {
            Invoke-WebRequest -Uri "$upstream/$license" -OutFile (Join-Path $licenseDir $license)
          }

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build build-Windows --parallel

      - name: Test
        run: ctest --test-dir build-Windows --output-on-failure --timeout 60

      - name: Create portable package
        run: cmake --build build-Windows --target package_windows

      - name: Read packaged executable version
        id: windows-version
        run: |
          $versionInfo = (Get-Item -LiteralPath build-Windows/package/diffpick/diffpick.exe).VersionInfo
          if ($versionInfo.ProductName -cne 'Diffpick' -or
              $versionInfo.ProductVersion -notmatch '^\d+\.\d+\.\d+$' -or
              $versionInfo.ProductVersion -cne $versionInfo.FileVersion) {
            throw 'The packaged executable has invalid product metadata.'
          }
          "version=$($versionInfo.ProductVersion)" >> $env:GITHUB_OUTPUT
          "package_name=diffpick-$($versionInfo.ProductVersion)-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Upload portable package
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.windows-version.outputs.package_name }}
          path: build-Windows/package/${{ steps.windows-version.outputs.package_name }}.zip
          if-no-files-found: error

  sign-windows:
    name: Sign Windows package
    if: github.event_name == 'workflow_dispatch' && inputs.sign_windows && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    needs: windows
    runs-on: windows-2022
    environment: signpath
    permissions:
      actions: read
      contents: read

    steps:
      - name: Submit to SignPath and wait for approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.windows.outputs.product_version) }}

      - name: Verify the timestamped executable
        env:
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
        run: |
          Expand-Archive -LiteralPath "signed/$env:PACKAGE_NAME.zip" -DestinationPath verify-signed
          $signature = Get-AuthenticodeSignature -LiteralPath verify-signed/diffpick.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Expected a valid timestamped Authenticode signature. Status: $($signature.Status)"
          }

      - name: Upload verified signed package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package_name }}-signed
          path: signed/${{ needs.windows.outputs.package_name }}.zip
          if-no-files-found: error

  appimage:
    name: Linux AppImage · Qt 6.4
    runs-on: ubuntu-22.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake curl g++ libgl1-mesa-dev ninja-build xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.3'
          arch: gcc_64
          # Qt 6.4.3 includes the Wayland client plugins in its desktop package.
          cache: true

      - name: Configure
        run: cmake --preset linux-release

      - name: Create AppImage
        id: appimage-package
        run: |
          cmake --build build-Linux --target package_appimage --parallel
          packages=(build-Linux/package/diffpick-*-linux-x86_64.AppImage)
          if [[ ${#packages[@]} -ne 1 || ! -x "${packages[0]}" ]]; then
            echo "Expected one versioned AppImage in build-Linux/package."
            exit 1
          fi
          echo "name=$(basename "${packages[0]}" .AppImage)" >> "$GITHUB_OUTPUT"
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test AppImage
        env:
          APPIMAGE_PATH: ${{ steps.appimage-package.outputs.path }}
        run: |
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "./$APPIMAGE_PATH" --version

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage-package.outputs.name }}
          path: ${{ steps.appimage-package.outputs.path }}
          if-no-files-found: error
